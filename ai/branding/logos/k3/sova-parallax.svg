<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SOVA Parallax mark (concept)">
  <!-- SOVA · PARALLAX — two watch-circles of equal radius overlap; the lens they
       share is filled and carries the pupil as a knocked-out hole. Two viewpoints,
       one focus: live watching of parallel sessions. Single colour, currentColor. -->
  <g stroke="currentColor" stroke-width="2.5" fill="none">
    <circle cx="11.2" cy="16" r="8.6"/>
    <circle cx="20.8" cy="16" r="8.6"/>
  </g>
  <path fill="currentColor" fill-rule="evenodd"
        d="M16 8.86 A8.6 8.6 0 0 1 16 23.14 A8.6 8.6 0 0 1 16 8.86 Z
           M13.6 16 a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0"/>
</svg>
