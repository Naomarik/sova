# pnpm settings for this project (.npmrc is gitignored as credential material).
# Only esbuild's install script runs. The other two are no-ops: @google/genai's
# preinstall is an echo, protobufjs's postinstall only warns about a version scheme.
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.3'
  - '@earendil-works/pi-agent-core@1.0.3'
  - '@earendil-works/pi-ai@1.0.3'
  - '@earendil-works/pi-codemode@1.0.3'
  - '@earendil-works/pi-coding-agent@1.0.3'
  - '@earendil-works/pi-mcp@1.0.3'
  - '@earendil-works/pi-telemetry@1.0.3'
  - '@earendil-works/pi-tui@1.0.3'
